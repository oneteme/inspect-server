server:
  port: 9001
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1MB
spring:
  security:
    enabled: false
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ''
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: inspect
  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
     # data-locations: classpath:data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2

#logging:
#  level:
#    org.usf.jquery: DEBUG
#    org.usf.inspect: DEBUG
#    org.springframework.jdbc.core: DEBUG
#    org.springframework.security: DEBUG
#    org.springframework.web: DEBUG

inspect:
  collector:
    enabled: false #default=false, enables the collector
    scheduling:
      interval: 30s #default=60s, interval between trace dispatches
      queue-capacity: 5000 #default=10000, queue capacity for trace dispatching !v1.2
    monitoring:
      webmvc:
        excludes:
          method: OPTIONS #default=[], exclude OPTIONS requests
          path: /favicon.ico #default=[], exclude matching request paths
      exception:
        max-stack-trace-rows: -1 #default=5, -1 no limit
        max-cause-depth: -1 #default=-1
        #class-name-pattern: my.site.app.*
    tracing:
      type: REST #default=null, trace dispatch type (e.g., REST) !v1.2
      remote:
        host: http://localhost:9001 #default=localhost, target dispatch host
        #retention-max-age: 10d #default=30d, maximum age of traces in days
  application:
    name: ${spring.application.name} 
    namespace: jarvis
    version: 0.0.1
  server:
    scheduling:
      interval: 30s #default=60s, interval between trace dispatches
      queue-capacity: 500000 #default=10000, queue capacity for trace dispatching !v1.2
      thread-name: inspect-srv-publisher #!v1.2
    reporting:
      enabled: true
    partition:
      enabled: true
      schedule: "0 0 0 L * ?"
      http-session: DAY
      http-request: DAY
      jdbc-request: DAY
      session-event: DAY
    purge:
      enabled: false
    migration:
      namespacePrefix: Jarvis


